<style>
/* Plate and catalogue: the piece is a plate (stage, caption, camera views); everything else is one quiet
   catalogue column that scrolls by itself. Wide windows: plate left, catalogue right. Tall windows: plate
   above, catalogue below. The page itself never scrolls. */
:root {
  color-scheme: dark;
  --ground: #0e0b10;
  --rail: #141016;                         /* the catalogue column: a shade above the vitrine, opaque */
  --panel: rgba(24, 19, 27, 0.9);
  --panel-solid: #1b161e;
  --well: #1f1923;
  --well-hi: #2c2432;
  --line: rgba(239, 230, 216, 0.12);
  --line-2: rgba(239, 230, 216, 0.24);
  --ink: #efe6d8;
  --ink-2: #b9ac9f;
  --ink-3: #8d8078;
  --gilt: #d2a65c;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --font-display: "Federo", "Marcellus", "Palatino Linotype", Georgia, serif;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  /* layout tokens, re-set per breakpoint */
  --rail-w: 0px;                           /* side layout only */
  --rail-h: 44vh;                          /* stack layout only */
  --pad: 16px;                             /* gutter of rail and plate */
  --hit: 44px;                             /* smallest touch target */
  --fs: 14px;
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  --st: env(safe-area-inset-top, 0px);  --sb: env(safe-area-inset-bottom, 0px);
}
@supports (height: 1svh) { :root { --rail-h: 44svh; } }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--ink); font: var(--fs)/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gilt); outline-offset: 2px; }
/* tiles and views sit in strips that scroll sideways and clip an outer ring: theirs is drawn inside, and in ink on a pressed one (its border is gilt already) */
.tile:focus-visible, .shot:focus-visible { outline-offset: -3px; }
.tile[aria-pressed="true"]:focus-visible, .shot[aria-pressed="true"]:focus-visible { outline-color: var(--ink); }

/* ---------- grid: stack (default: phones and anything taller than wide) ---------- */
.app {
  position: relative; overflow: hidden;
  height: 100vh; height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto auto minmax(0, var(--rail-h));
  grid-template-areas: "mast" "." "caption" "shots" "rail";
}
.stage, .status, .controls { grid-column: 1; grid-row: 1 / 5; }   /* the stage cell, and what lies over the whole of it */
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.toast { grid-column: 1; grid-row: 2; }   /* the free band of the stage: always just above the caption and the views */
.mast  { grid-area: mast; z-index: 2; }
.caption { grid-area: caption; z-index: 2; }
.shots { grid-area: shots; z-index: 2; }
.rail  { grid-area: rail; z-index: 2; }

/* ---------- masthead ---------- */
.mast {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: max(10px, var(--st)) max(var(--pad), var(--sr)) 8px max(var(--pad), var(--sl));
  pointer-events: none;                    /* over the stage in the stack layout: drags pass to the canvas */
}
.mast > * { pointer-events: auto; }
.brand { min-width: 0; }
.eyebrow, .h, .cap-k {
  margin: 0; font: 500 10.5px/1.3 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
}
.mast .eyebrow { display: none; }
:lang(hu) .mast .eyebrow { letter-spacing: 0.1em; }   /* the Hungarian line is longer: set a little tighter it breaks where the English one does */
.wordmark { margin: 0; font: 400 30px/1 var(--font-display); letter-spacing: 0.02em; }
.lang { display: flex; flex: none; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px; background: rgba(14, 11, 16, 0.55); }
.lang button {
  min-width: var(--hit); height: calc(var(--hit) - 6px); padding: 0 10px; border: 0; border-radius: 999px; background: none; cursor: pointer;
  font: 500 11.5px/1 var(--font-ui); letter-spacing: 0.1em; color: var(--ink-2);

/* ---------- plate bar: caption left, camera shots right ---------- */
.caption { margin: 0; padding: 0 max(var(--pad), var(--sr)) 8px max(var(--pad), var(--sl)); pointer-events: none; align-self: end; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7); min-width: 0; }
.caption b { display: inline; font: 400 19px/1.15 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; }
.caption .c1 { display: inline; margin-left: 10px; color: var(--ink-2); font-size: 12.5px; }
.caption .c2 { display: none; font: 400 10.5px/1.4 var(--font-data); color: var(--ink-2); margin-top: 3px; }
/* stack layout, and the side layout of a phone on its side: a long name sends form and height to a line of their own */
@media (max-width: 699px) and (max-aspect-ratio: 9999/10000), (max-width: 559px), (min-aspect-ratio: 1/1) and (min-width: 560px) and (max-width: 999px), (min-aspect-ratio: 1/1) and (min-width: 560px) and (max-height: 599px) {

  .app:not(.present) .caption b, .app:not(.present) .caption .c1 { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .app:not(.present) .caption .c1 { margin-left: 0; }

.shot.present { order: -1; padding: 0; position: relative; }
.shot.save { display: none; order: -1; }                    /* the presented picture: among the views only while presenting */
.app.present .shot.save { display: inline-flex; }
.shot.present span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }   /* icon alone where room is short; the name stays for screen readers */

/* ---------- catalogue rail ---------- */
.rail {
  background: var(--rail); border-top: 1px solid var(--line);
  overflow: hidden auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--well-hi) transparent;
  padding: 14px 0 max(20px, var(--sb));
  display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; row-gap: 18px;
}
.rail > *, .set > *, .facts > * { padding: 0 max(var(--pad), var(--sr)) 0 max(var(--pad), var(--sl)); min-width: 0; }
.rail > .set, .rail > .facts { padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; row-gap: 18px; }
.rail .intro { display: none; }            /* stack layout: the story sits after the pickers (see .story) */
.h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.h small { font: 400 11.5px/1.3 var(--font-ui); letter-spacing: 0; text-transform: none; color: var(--ink-2); }

/* pickers: on the stack layout each is one strip that scrolls sideways and bleeds to the screen edge */
.picker { padding: 0 !important; }
.picker .h { padding: 0 max(var(--pad), var(--sr)) 0 max(var(--pad), var(--sl)); }
.tiles {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity;
  padding: 2px max(var(--pad), var(--sr)) 2px max(var(--pad), var(--sl)); scroll-padding: 0 var(--pad);
}
.tiles::-webkit-scrollbar { display: none; }
.tile {
  flex: 0 0 auto; scroll-snap-align: start; cursor: pointer; text-align: left;
  background: var(--well); border: 1px solid var(--line); border-radius: 4px; color: var(--ink-2);
}
.tile:hover { color: var(--ink); border-color: var(--line-2); }
.tile[aria-pressed="true"] { color: var(--ink); border-color: var(--gilt); background: var(--well-hi); box-shadow: inset 0 -2px 0 var(--gilt); }
.tile.lustre { display: grid; grid-template-columns: 30px auto; align-items: center; column-gap: 10px; min-height: 52px; padding: 8px 14px 8px 10px; }
.tile.lustre .sw { grid-row: 1 / 3; width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.45), inset 0 3px 6px rgba(255, 255, 255, 0.28); }
.tile.lustre .n { font: 400 15.5px/1.15 var(--font-display); letter-spacing: 0.05em; color: var(--ink); align-self: end; }
.tile.lustre .t { font-size: 11.5px; line-height: 1.2; color: var(--ink-3); align-self: start; white-space: nowrap; }
.tile.lustre[aria-pressed="true"] .t { color: var(--ink-2); }   /* on the lighter well the third ink is too faint */
.tile.form { display: grid; justify-items: center; align-content: end; gap: 5px; width: 76px; min-height: 76px; padding: 8px 4px 7px; text-align: center; font-size: 11.5px; line-height: 1.15; }
.tile.form svg { opacity: 0.8; }
.tile.form span { min-height: 2.3em; display: grid; place-items: center; }
.tile.form[aria-pressed="true"] svg { opacity: 1; color: var(--gilt); }

.surprise {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 48px; cursor: pointer;
  background: var(--gilt); color: #1a130a; border: 0; border-radius: 4px; font: 600 14px/1 var(--font-ui); letter-spacing: 0.02em;
}
.surprise:hover { background: #dfb56c; }
.surprise:active { transform: translateY(1px); }
.app.loading .set, .app.loading .facts { visibility: hidden; }   /* until the page is built there is nothing to pick and nothing listens; the words stay readable */
.hint { margin: 7px 0 0; font-size: 11.5px; color: var(--ink-3); text-align: center; }
@media (pointer: coarse) {

  .lang { padding: 0; } .lang button { height: var(--hit); }

/* a strip that scrolls sideways fades out at its far edge, so a cut-off tile reads as "more" */
.tiles, .shots { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }

.film dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0; }
.film dt, .film dd { padding: 7px 0; border-bottom: 1px solid var(--line); }
.film dt { color: var(--ink-2); padding-right: 12px; }
.film dd { margin: 0; text-align: right; font: 400 12.5px/1.6 var(--font-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.link-btn { background: none; border: 0; padding: 6px 0; margin: -6px 0; cursor: pointer; color: var(--ink-2); font: 400 12px var(--font-ui); letter-spacing: 0; text-transform: none; text-decoration: underline; text-underline-offset: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 6px; color: var(--ink-2); font-size: 11.5px; }

.story p:first-of-type { color: var(--ink); }

@media (pointer: coarse) { .link-btn { min-width: 44px; min-height: 44px; padding: 14px 0 14px 12px; margin: -14px 0; } }
@media (max-height: 700px) and (max-aspect-ratio: 9999/10000) {   /* short phones: the plate keeps the larger share */
  :root { --rail-h: 38vh; }
  @supports (height: 1svh) { :root { --rail-h: 38svh; } }
}
.tile.form span { overflow-wrap: anywhere; hyphens: auto; }

/* ---------- tablet upright: taller plate, the catalogue in two columns ---------- */
@media (min-width: 700px) and (max-aspect-ratio: 9999/10000) {

  .app { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr) auto minmax(0, var(--rail-h)); grid-template-areas: "mast mast" ". ." "caption shots" "rail rail"; }
  .stage, .status, .controls { grid-row: 1 / 4; }

  .tiles { display: grid; overflow: visible; padding-right: max(var(--pad), var(--sr)); }
  .tiles, .shots { -webkit-mask-image: none; mask-image: none; }
  .tiles.lustres { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles.forms { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tile.form { width: auto; min-height: 76px; }
  .tile.lustre { min-height: 52px; }
}
@media (min-aspect-ratio: 1/1) and (min-width: 1000px) and (max-width: 1279px) and (min-height: 600px) {   /* a narrow plate: the caption gives way to the shots and wraps in the track they leave */
  .caption .c2 { display: none; }
  .shot kbd { display: none; }
  .shots { padding-left: 8px; }
  .app:not(.present) .shot.present { padding: 0; margin-left: 4px; }          /* the icon alone again: its width goes to the caption */
  .app:not(.present) .shot.present span { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); }
}
@media (min-aspect-ratio: 1/1) and (min-width: 1500px) and (min-height: 600px) {
  .tiles.lustres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile.lustre { grid-template-columns: 34px auto; }
  .tile.lustre .sw { width: 34px; height: 34px; }
}
@media (min-width: 1800px) and (min-height: 900px) {
  :root { --fs: 15px; --pad: 32px; }
  .caption b { font-size: 26px; }
  .tile.form { min-height: 88px; font-size: 12.5px; }
}
@media (min-width: 2200px) and (min-height: 1200px) {
  :root { --fs: 17px; --pad: 40px; --rail-w: clamp(340px, 27vw, 720px); }
  .eyebrow, .h, .cap-k { font-size: 12px; }
  .caption b { font-size: 32px; } .caption .c1 { font-size: 16px; } .caption .c2 { font-size: 12.5px; }
  .shot { font-size: 15px; padding: 0 16px; min-height: 44px; }
  .tile.lustre { min-height: 64px; } .tile.lustre .n { font-size: 19px; } .tile.lustre .t { font-size: 13px; }
  .tile.form { min-height: 104px; font-size: 14px; } .tile.form svg { width: 32px; height: 40px; }
  .surprise { min-height: 56px; font-size: 16px; }
  .film dd { font-size: 14.5px; } .hint, .legend, .colophon { font-size: 13px; }
}
@media (pointer: fine) and (min-width: 1000px) { :root { --hit: 36px; } }

@media (min-width: 900px) and (max-aspect-ratio: 9999/10000) { .caption .c2 { display: block; } }
@media (min-width: 700px) and (max-aspect-ratio: 9999/10000) {   /* upright tablet: both pickers and Surprise me in sight without scrolling the catalogue */
  :root { --rail-h: 45vh; }
  @supports (height: 1svh) { :root { --rail-h: 45svh; } }
  .rail { padding-top: 18px; }
  .rail > .set { row-gap: 14px; }
  .tile.lustre { min-height: 46px; padding-top: 5px; padding-bottom: 5px; }
  .tile.form { min-height: 64px; }
}
@media (max-height: 700px) and (max-width: 699px) and (max-aspect-ratio: 9999/10000) {   /* short phones: both pickers and Surprise me in sight at once */
  .rail { padding-top: 10px; row-gap: 12px; }
  .rail > .set, .rail > .facts { row-gap: 12px; }
  .h { margin-bottom: 6px; }
  .tile.lustre { min-height: 44px; padding: 5px 12px 5px 8px; }
  .tile.form { width: 72px; min-height: 64px; padding: 6px 4px 5px; gap: 3px; }
  .tile.form svg { width: 21px; height: 26px; }
  .tile.form span { min-height: 0; }
}

/* ---------- chart details, toast, curtain ---------- */
.rail h2 { font-weight: 500; }
.film dd span { white-space: nowrap; }
.h > span { min-width: 0; }
.h { flex-wrap: wrap; }
.spectrum > .h { flex-wrap: nowrap; }      /* a long heading wraps beside the toggle; the toggle keeps the top right */
.spectrum > .h h2 { min-width: 0; }
.spectrum > .h .link-btn { flex: none; white-space: nowrap; }
.link-btn:hover { color: var(--ink); }
.chart { position: relative; }
.chart svg { max-height: 38vh; }
.chart .end-label { fill: var(--ink-2); }
.tip {
  position: absolute; top: 0; left: 0; z-index: 3; pointer-events: none;
  padding: 6px 8px; min-width: 96px;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 3px;
  font: 400 11px/1.5 var(--font-data); font-variant-numeric: tabular-nums; color: var(--ink);
  white-space: nowrap;
}
.tip b { font-weight: 500; color: var(--ink-2); display: block; }
.tip i { display: inline-block; width: 8px; height: 2px; margin-right: 6px; vertical-align: middle; }
.chart table { width: 100%; border-collapse: collapse; font: 400 11.5px/1.5 var(--font-data); font-variant-numeric: tabular-nums; }
.chart th, .chart td { text-align: right; padding: 4px 0 4px 8px; border-bottom: 1px solid var(--line); }
.chart th { color: var(--ink-3); font-weight: 400; }
.chart th:first-child, .chart td:first-child { text-align: left; padding-left: 0; color: var(--ink-2); }
.spectrum .h + .legend { margin-top: 0; }
.angles { margin-top: 14px; }
.colophon .touch { display: none; }
@media (pointer: coarse) { .colophon .fine { display: none; } .colophon .touch { display: inline; } }
.story .h { margin-bottom: 8px; }

.status {
  z-index: 1; pointer-events: none;
  display: grid; place-items: center; padding: 24px; text-align: center;
  color: var(--ink-2); background: var(--ground); transition: opacity 1.2s;   /* a curtain over the stage until the first picture is drawn */
}
.status.out { opacity: 0; }
.status.error { grid-column: 1 / -1; grid-row: 1 / -1; pointer-events: auto; color: var(--ink); }
.app.failed .rail, .app.failed .caption, .app.failed .shots { visibility: hidden; }   /* nothing to choose from; the language switch stays */
.app.failed .mast { background: none; border: 0; }
.status p { max-width: 38em; margin: 0; }
.toast {
  z-index: 6; align-self: end; justify-self: center; margin: 0 16px 12px;
  padding: 8px 12px; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 4px;
  color: var(--ink); max-width: min(calc(100% - 32px), 440px); text-align: center; text-wrap: balance;
  transition: opacity 0.25s, visibility 0s 0.25s; opacity: 0; visibility: hidden; pointer-events: none;
}
.toast.show { opacity: 1; visibility: visible; transition-delay: 0s; pointer-events: auto; }
.toast .link-btn { margin: -6px 0 -6px 10px; color: var(--gilt); font-size: inherit; white-space: nowrap; }
.toast .n { font-family: var(--font-data); font-size: 0.92em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
@media (pointer: coarse) { .toast .link-btn { padding: 14px 4px 14px 8px; margin: -14px 0 -14px 4px; } }

/* ---------- presentation: the catalogue leaves, the plate takes the window, the caption stands at the foot of the picture ---------- */
.shots, .caption { transition: opacity 0.4s; }
.app.present { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: none; }
.app.present .mast, .app.present .rail { display: none; }
.app.present .stage, .app.present .status, .app.present .toast { grid-area: 1 / 1 / 2 / 2; }
.app.present .toast { margin-bottom: 132px; }                 /* clear of the caption, and of the views when they are back */
@media (max-height: 520px) { .app.present .toast { align-self: start; margin-top: max(12px, var(--st)); margin-bottom: 0; } }   /* a low window: at the top, not across the piece */
.app.present .caption {
  position: absolute; grid-area: auto; z-index: 2; left: max(5%, var(--sl)); bottom: max(5%, var(--sb)); max-width: 60%;
  padding: 0; white-space: normal; overflow: visible;
}
.app.present.framed .caption { left: var(--slate-x); bottom: var(--slate-y); }
.app.present .caption b { display: block; font-size: 19px; }
.app.present .caption .c1 { display: block; margin: 5px 0 0; font-size: 12.5px; }
.app.present .caption .c2 { display: block; }
.app.present .shots {
  position: absolute; grid-area: auto; z-index: 3; left: 0; right: 0; bottom: 0; justify-self: stretch; justify-content: flex-start; justify-content: safe center; overflow-x: auto;
  padding: 2px max(var(--pad), var(--sr)) max(14px, var(--sb)) max(var(--pad), var(--sl));
  -webkit-mask-image: none; mask-image: none; opacity: 0; pointer-events: none;
}
.app.present.peek .shots { opacity: 1; pointer-events: auto; }
.app.present.peek .caption { opacity: 0; }
.app.present .shot.present { padding: 0 14px; }
.app.present .shot.present span { position: static; width: auto; height: auto; clip-path: none; }
@media (max-width: 559px) { .app.present .shots { justify-content: flex-start; } }

/* ---------- the configurator (lil-gui, re-skinned): not part of the page unless asked for; then a drawer over the left of the stage ---------- */
.controls {
  position: absolute; z-index: 4; left: max(12px, var(--sl)); top: 12px; bottom: 12px; width: min(332px, calc(100% - 24px));
  display: flex; flex-direction: column;   /* lil-gui's own list is the scroller: only then can its sliders */
  overflow: hidden;                        /* tell a scroll (swipe or wheel) from a drag */
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px; font-size: 13px; line-height: 1.45;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.controls:not(.open), .app.present .controls { display: none; }
.controls .lil-gui {
  --width: 100%;
  --background-color: transparent;
  --text-color: var(--ink-2);
  --title-background-color: transparent;
  --title-text-color: var(--ink);
  --widget-color: var(--well);
  --hover-color: var(--well-hi);
  --focus-color: var(--well-hi);
  --number-color: var(--gilt);
  --string-color: var(--ink);
  --font-family: var(--font-ui);
  --font-family-mono: var(--font-data);
  --font-size: 12px;
  --input-font-size: 11.5px;
  --padding: 8px;
  --spacing: 6px;
  --widget-height: 22px;
  --name-width: 46%;
  --slider-input-width: 30%;
  --folder-indent: 8px;
  --widget-border-radius: 2px;
}
.controls .lil-gui.root > .title { display: none; }   /* the tool bar heads the panel */
.controls .lil-gui.root { min-height: 0; }
.controls .lil-gui.root > .children { padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: var(--well-hi) transparent; overscroll-behavior: contain; }
.controls .lil-gui .lil-gui > .title {
  font-weight: 500; border-top: 1px solid var(--line); height: 32px; line-height: 32px; padding-left: 14px;
  position: sticky; top: 0; z-index: 1; background: var(--panel-solid);   /* stays in sight while its rows scroll */
}
.controls .lil-gui .lil-gui > .title[data-changed]:not([data-changed=""])::after {
  content: attr(data-changed); float: right; padding-right: 12px; font-weight: 400; font-size: 11px; color: var(--gilt);
}
.controls .lil-gui .lil-gui > .children { border-left: 0; margin-left: 0; padding: 2px 8px 8px 14px; }
.controls .lil-gui .controller { min-height: 24px; position: relative; }
.controls .lil-gui .controller.changed::before {     /* differs from the preset it started from */
  content: ''; position: absolute; left: -9px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--gilt);
}
/* A row that can do nothing stays readable and still answers hover and tap (the help strip says what it waits for); its widget stays inert. */
.controls .lil-gui .controller.disabled { opacity: 1; pointer-events: auto !important; }
.controls .lil-gui .controller.disabled .name { color: var(--ink-3); }
.controls .lil-gui .controller.disabled .widget { opacity: 0.35; pointer-events: none; }
/* A lock on a row: Surprise me and the dice keep its value. Dim until the row is pointed at, gilt and closed when set. */
.controls .lil-gui .controller .lock {
  flex: 0 0 22px; width: 22px; height: var(--widget-height); margin-left: 2px; padding: 0; border: 0; background: none; color: var(--ink-3); opacity: 0.35; cursor: pointer; border-radius: 3px;
}
.controls .lil-gui .controller .lock svg { display: block; margin: auto; overflow: visible; }
.controls .lil-gui .controller:hover .lock, .controls .lil-gui .controller .lock:focus-visible, .controls .lil-gui .controller.locked .lock { opacity: 1; }
.controls .lil-gui .controller.locked .lock { color: var(--gilt); }
.controls .lil-gui .controller:not(.locked) .lock .shackle { transform: translateX(2.5px) rotate(-25deg); transform-origin: 8.5px 5.5px; }   /* an open shackle */
.controls .lil-gui .controller.locked .name { text-decoration: underline dotted var(--gilt); text-underline-offset: 3px; }
.controls .lil-gui .controller.nolock { padding-right: calc(var(--padding) + 24px); }   /* never rolled: no lock, the widgets stay in line */
/* The dice of a group, at the end of its title and sticking with it. */
.controls .lil-gui .lil-gui.diced > .title { padding-right: 36px; }
.controls .lil-gui .dice {
  display: block; position: sticky; top: 0; z-index: 2; width: 28px; height: 32px; margin: -32px 6px 0 auto; padding: 0; border: 0; background: none; color: var(--ink-3); cursor: pointer; border-radius: 3px;
}
.controls .lil-gui .dice svg { display: block; margin: auto; }
.controls .lil-gui .dice:hover, .controls .lil-gui .dice:focus-visible { color: var(--gilt); background: none; }
.controls .lil-gui .controller .name { width: var(--name-width); white-space: normal; overflow-wrap: anywhere; line-height: 1.25; padding-right: 6px; }
.controls .lil-gui .controller.function .name { text-align: left; padding: 0 8px; }
.controls .lil-gui .slider { --slider-color: var(--gilt); }
.controls .lil-gui .controller.number .fill { background: var(--gilt); opacity: 0.55; border-right-color: var(--gilt); }
/* A tinted track is a ramp of the lustre colour each value would give; the fill shrinks to a thumb line. */
.controls .lil-gui .controller.number.tint .fill { background: transparent; opacity: 1; border-right: 2px solid var(--ink); box-shadow: 1px 0 0 rgba(0, 0, 0, 0.7); }
.controls .lil-gui .controller.tint .slider { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35); }
.controls .lil-gui input:focus-visible, .controls .lil-gui button:focus-visible, .controls .lil-gui .title:focus-visible,
.qbar button:focus-visible, .qmenu button:focus-visible { outline: 2px solid var(--gilt); outline-offset: -1px; }
.controls .lil-gui .title:focus-visible { text-decoration: none; }
.controls .lil-gui .option:focus-within .display, .controls .lil-gui .controller.color .display:focus-within { outline: 2px solid var(--gilt); outline-offset: 1px; }
.controls .lil-gui .more-link {
  height: auto; padding: 10px 14px; text-align: left; background: none; color: var(--ink-3);
  border-top: 1px solid var(--line); border-radius: 0;
}
.controls .lil-gui .more-link:hover { color: var(--ink); background: none; }

.qbar { flex: none; display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.qbar button, .qmenu button {
  height: 28px; padding: 0 8px; background: var(--well); border: 1px solid var(--line); border-radius: 2px;
  color: var(--ink-2); cursor: pointer; font: 12px var(--font-ui);
}
.qbar button:hover, .qmenu button:hover { color: var(--ink); }
.qbar button[disabled], .qmenu button[disabled] { opacity: 0.4; cursor: default; }
.seg { display: flex; flex: none; }
.seg button:first-child { border-radius: 2px 0 0 2px; }
.seg button + button { border-radius: 0 2px 2px 0; margin-left: -1px; }
.seg button[aria-pressed="true"] { color: var(--ink); border-color: var(--gilt); position: relative; }
#q-surprise { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qbar .ico { flex: none; width: 30px; padding: 0; font-size: 15px; }
.qmenu {
  position: absolute; z-index: 3; right: 10px; top: 45px; min-width: 190px; display: grid;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 3px; padding: 4px;
  max-height: calc(100% - 53px); overflow-y: auto; overscroll-behavior: contain;   /* a short panel: the list scrolls, nothing is cut off */
}
.qmenu[hidden], .qmenu [hidden] { display: none; }
.qmenu > div { display: grid; gap: 4px; }
.qmenu .qitems { gap: 0; }
.qmenu .qitems button { text-align: left; height: 30px; background: transparent; border-color: transparent; }
.qmenu .qitems button:not([disabled]):hover { background: var(--well-hi); }
.qmenu .qitems button[aria-checked]::after { content: '✓'; float: right; color: var(--gilt); opacity: 0; }
.qmenu .qitems button[aria-checked="true"]::after { opacity: 1; }
.qmenu textarea {
  width: 236px; max-width: 100%; resize: vertical; padding: 6px; background: var(--well); color: var(--ink);
  border: 1px solid var(--line); border-radius: 2px; font: 11px/1.4 var(--font-data);
}
.qmenu .qrow { display: flex; gap: 6px; justify-content: flex-end; }
.help {
  flex: none; height: 80px; padding: 8px 14px; border-top: 1px solid var(--line);   /* fixed height: its text must not resize the card */
  color: var(--ink-2); font-size: 11.5px; line-height: 1.4; overflow: hidden auto; scrollbar-width: thin;
}
.help b { color: var(--ink); font-weight: 500; }
.help .link-btn { padding: 0; margin: 0; font-size: inherit; }
.help .rng { color: var(--ink-3); font-family: var(--font-data); font-size: 10.5px; }
@media (pointer: coarse) {                 /* finger-sized rows; 16 px inputs keep iOS from zooming in on focus */
  .controls .lil-gui { --widget-height: 30px; --font-size: 13px; --input-font-size: 16px; }
  .controls .lil-gui .controller { min-height: 32px; }
  .controls .lil-gui .lil-gui > .title { height: 40px; line-height: 40px; }
  .controls .lil-gui .dice { height: 40px; margin-top: -40px; width: 40px; margin-right: 2px; }
  .controls .lil-gui .lil-gui.diced > .title { padding-right: 44px; }
  .controls .lil-gui .controller .lock { flex-basis: 32px; width: 32px; opacity: 0.6; }
  .controls .lil-gui .controller.nolock { padding-right: calc(var(--padding) + 34px); }
  .qbar button, .qmenu .qitems button, .qmenu .qrow button { height: 40px; }
  .qbar .ico { width: 38px; }
  .qbar { gap: 4px; padding-left: 8px; padding-right: 8px; }   /* the wider icon buttons leave the one button that gives way its whole label */
  .qbar button { padding: 0 6px; }
  .qmenu { top: 53px; }
  .qmenu textarea { font-size: 16px; }
}

@media (max-width: 359px) {                /* the narrowest phones: the tool bar closes up, and Surprise me may take two lines rather than lose its end */
  .qbar { gap: 4px; padding-left: 6px; padding-right: 6px; }
  .qbar button { padding: 0 5px; }
  #q-surprise { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.05; font-size: 11.5px; }
}
@media (max-width: 720px) { .help { height: 62px; padding: 6px 14px; } .help .lvl { display: none; } }
@media (max-height: 480px) { .help { height: 44px; padding: 5px 14px; } }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
  .controls .lil-gui.transition > .children { transition-duration: 0s !important; }
}
</style>
</head>
<body>
<div class="app loading" id="app">
  <header class="mast">
    <div class="brand">
      <p class="eyebrow" data-i18n="ui.eyebrow"></p>
      <h1 class="wordmark">Eozin</h1>
    </div>
    <div class="lang" role="group" aria-label="Language" data-i18n-aria-label="ui.lang.aria">
      <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button><button type="button" data-lang="hu" lang="hu" aria-label="Magyar" aria-pressed="false">HU</button>
    </div>
  </header>

  <div class="stage" id="stage" role="img" aria-label="Interactive 3D view of a ceramic vessel with eozin lustre glaze" data-i18n-aria-label="stage.aria"></div>

  <figure class="caption" id="slate"></figure>
  <div class="shots" id="view-chips" role="group" aria-label="Camera views" data-i18n-aria-label="ui.section.views"></div>

  <main class="rail" id="rail">
    <p class="intro" data-i18n="ui.lede"></p>

    <div class="set">
      <section class="picker" aria-labelledby="lu-h">
        <h2 class="h" id="lu-h"><span data-i18n="ui.section.lustre"></span></h2>
        <div class="tiles lustres" id="lustre-chips"></div>
      </section>
      <section class="picker" aria-labelledby="fo-h">
        <h2 class="h" id="fo-h"><span data-i18n="ui.section.shape"></span></h2>
        <div class="tiles forms" id="form-chips"></div>
      </section>
      <div>
        <button class="surprise" type="button" id="surprise">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1l1.800 5.200L16 8l-5.200 1.800L9 15l-1.800-5.200L2 8l5.200-1.800z" fill="currentColor"/></svg>
          <span data-i18n="ui.surprise"></span>
        </button>
        <p class="hint keys" data-i18n="ui.surprise.hint"></p>
      </div>
    </div>

    <div class="facts">
      <section class="film" aria-labelledby="film-h">
        <h2 class="h" id="film-h"><span data-i18n="ui.film.h"></span></h2>
        <dl id="film-data"></dl>
      </section>
      <section class="spectrum" aria-labelledby="spec-h">
        <div class="h">
          <h2 class="eyebrow" id="spec-h" data-i18n="ui.spec.h"></h2>
          <button class="link-btn" type="button" id="chart-toggle" aria-pressed="false" data-i18n="ui.chart.table"></button>
        </div>
        <div class="legend" aria-hidden="true">
          <span><i style="background: var(--series-1)"></i><span data-i18n="ui.legend.faceon"></span></span>
          <span><i style="background: var(--series-2)"></i>45°</span>
          <span><i style="background: var(--series-3)"></i>70°</span>
        </div>
        <div class="chart" id="chart"></div>
        <div class="angles">
          <h2 class="h"><span data-i18n="ui.angles.h"></span></h2>
          <div class="angle-strip" id="angle-strip" role="img" aria-label="Lustre colour from face-on to grazing view" data-i18n-aria-label="ui.angles.aria"></div>
          <div class="angle-axis" aria-hidden="true"><span>0°</span><span>45°</span><span>85°</span></div>
        </div>
      </section>
    </div>

    <section class="story" aria-labelledby="story-h">
      <h2 class="h" id="story-h"><span data-i18n="ui.story.h"></span></h2>
      <p class="lede" data-i18n="ui.lede"></p>

  if (a > 1e-6) { float h = b * b - a * c; if (h <= 0.0) run = false; else t1 = (-b + sqrt(h)) / a; } else if (c > 0.0) run = false;
  if (d.y > 1e-5) t1 = min(t1, (uEzProfP.w - o.y) / d.y); else if (d.y < -1e-5) t1 = min(t1, (uEzProfP.x - o.y) / d.y);
  if (run && t1 > 0.0) {
    float lo = 0.0, hi = 0.0, glo = 0.05, ghi = 1.0;       // g: clearance from the wall, > 0 while the ray is free
    for (int i = 0; i < 24; i++) {
      if (float(i) >= uEzSteps) break;
      float f = min((float(i) + jit) / (uEzSteps - 1.0), 1.0);
      hi = t1 * f * sqrt(f);                               // denser near the surface the ray leaves; the last step reaches the end of the ray
      vec3 p = o + hi * d; s = ezProf(p);
      ghi = cav ? s.g - length(p.xz) : length(p.xz) - s.r;
      if (ghi < 0.0) break;
      lo = hi; glo = ghi;
    }
    if (ghi < 0.0) {
      for (int k = 0; k < 6; k++) {
        float m = 0.5 * (lo + hi); vec3 p = o + m * d; s = ezProf(p);
        float gm = cav ? s.g - length(p.xz) : length(p.xz) - s.r;
        if (gm < 0.0) { hi = m; ghi = gm; } else { lo = m; glo = gm; }
      }
      float th = mix(lo, hi, clamp(glo / max(glo - ghi, 1e-5), 0.0, 1.0));
      vec3 ph = o + th * d;
      vec2 uv = ezProfUv(ph);
      s = textureLod(uEzProf, uv, 0.0);
      vec4 g = textureLod(uEzProfN, uv, 0.0);
      float r = max(length(ph.xz), 0.05);
      vec3 rad = vec3(ph.x, 0.0, ph.z) / r, tng = vec3(-rad.z, 0.0, rad.x);
      n = normalize(rad - vec3(0.0, cav ? g.b : g.r, 0.0) - tng * ((cav ? g.a : g.g) / r));
      if (dot(n, d) > 0.0) n = -n;
      // off the silhouette of what it hit. From outside sooner: a ray that skims up a flaring neck meets the rows of
      // the height field one by one, and its image of them is a stack of rings
      float w = cav ? smoothstep(0.0, 0.2, -dot(n, d)) : smoothstep(0.1, 0.4, -dot(n, d));
      if (cav) {
        // the cavity's wall goes on upwards as a cylinder over the open mouth (buildSelfMap): a ray that leaves through
        // the mouth "hits" above the lip and counts for nothing, one that lands just under the lip for a little
        vec4 lip = textureLod(uEzProfN, vec2(uv.x, 0.001953125), 0.0);   // row 0: the lip's height and the mouth's radius at this angle
        w *= smoothstep(0.0, 0.15 + (0.05 + foot) * th, lip.r - ph.y);
        ao = s.a; ezHitRo = 0.3;                          // a throat's turning rings would comb a sharp second image into streaks
        vec3 r2 = reflect(d, n);                           // the hit's own mirror image: the room, if it leaves through the mouth
        vec3 pc = ph + r2 * ((lip.r - ph.y) / max(r2.y, 0.02));
        ezHitVis = smoothstep(-0.1, 0.1, r2.y) * smoothstep(-0.2 * lip.g - 0.1, 0.1 * lip.g + 0.1, lip.g - length(pc.xz));
      } else {
        w *= 1.0 - smoothstep(0.0, 0.3, s.g - r);          // in through the open mouth: not a wall
        // a ray that clips an edge or pierces a thin rim is soon out again, and whether a sample caught it there was
        // chance: a hit counts only where the ray stays in for longer than the march's stride at that distance
        vec3 p2 = ph + (0.1 + 1.9 * t1 * pow(th / t1, 0.3333) / (uEzSteps - 1.0)) * d;
        w *= smoothstep(0.0, 0.3, ezProf(p2).r - length(p2.xz));
        // a convex shoulder mirrored in a waisted neck is squeezed: centimetres of it to the pixel, and more the flatter
        // the ray meets it (under a lid's brim the far edge of that image was a dark band ruled with lines). Its image is
        // blurred by as much as a pixel takes in, and given up where that is most of the shoulder
        w *= 1.0 - smoothstep(0.25, 0.7, foot * th / max(-dot(n, d), 0.05));
        ao = s.b; ezHitVis = ao; ezHitRo = min(2.0 * foot * th, 0.7);
      }
      if (w > 0.0) { best = th; ezHitW = w; }
    }
  }
  return best;
}

// ---- noise
float ezHash(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
vec3 ezHash3(vec3 p) { p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }
float ezGrad(vec3 i, vec3 f, vec3 o) { return dot(ezHash3(i + o) * 2.0 - 1.0, f - o); }
float ezNoise(vec3 x) {                        // gradient noise, remapped to about 0..1
  vec3 i = floor(x), f = fract(x);
  vec3 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  return 0.5 + 0.62 * mix(
    mix(mix(ezGrad(i, f, vec3(0, 0, 0)), ezGrad(i, f, vec3(1, 0, 0)), u.x), mix(ezGrad(i, f, vec3(0, 1, 0)), ezGrad(i, f, vec3(1, 1, 0)), u.x), u.y),
    mix(mix(ezGrad(i, f, vec3(0, 0, 1)), ezGrad(i, f, vec3(1, 0, 1)), u.x), mix(ezGrad(i, f, vec3(0, 1, 1)), ezGrad(i, f, vec3(1, 1, 1)), u.x), u.y), u.z);
}
vec4 ezNoiseD(vec3 x) {                       // the same noise with its gradient: (value, d/dx)
  vec3 i = floor(x), f = fract(x);
  vec3 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0), du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  vec3 ga = ezHash3(i) * 2.0 - 1.0, gb = ezHash3(i + vec3(1, 0, 0)) * 2.0 - 1.0, gc = ezHash3(i + vec3(0, 1, 0)) * 2.0 - 1.0, gd = ezHash3(i + vec3(1, 1, 0)) * 2.0 - 1.0;
  vec3 ge = ezHash3(i + vec3(0, 0, 1)) * 2.0 - 1.0, gf = ezHash3(i + vec3(1, 0, 1)) * 2.0 - 1.0, gg = ezHash3(i + vec3(0, 1, 1)) * 2.0 - 1.0, gh = ezHash3(i + vec3(1, 1, 1)) * 2.0 - 1.0;
  float va = dot(ga, f), vb = dot(gb, f - vec3(1, 0, 0)), vc = dot(gc, f - vec3(0, 1, 0)), vd = dot(gd, f - vec3(1, 1, 0));
  float ve = dot(ge, f - vec3(0, 0, 1)), vf = dot(gf, f - vec3(1, 0, 1)), vg = dot(gg, f - vec3(0, 1, 1)), vh = dot(gh, f - vec3(1, 1, 1));
  float kxy = va - vb - vc + vd, kyz = va - vc - ve + vg, kzx = va - vb - ve + vf, kxyz = -va + vb + vc - vd + ve - vf - vg + vh;
  float v = va + u.x * (vb - va) + u.y * (vc - va) + u.z * (ve - va) + u.x * u.y * kxy + u.y * u.z * kyz + u.z * u.x * kzx + u.x * u.y * u.z * kxyz;
  vec3 d = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.z * (ge - ga) + u.x * u.y * (ga - gb - gc + gd) + u.y * u.z * (ga - gc - ge + gg) + u.z * u.x * (ga - gb - ge + gf) + u.x * u.y * u.z * (-ga + gb + gc - gd + ge - gf - gg + gh)
    + du * (vec3(vb - va, vc - va, ve - va) + u.yzx * vec3(kxy, kyz, kzx) + u.zxy * vec3(kzx, kxy, kyz) + u.yzx * u.zxy * kxyz);
  return vec4(0.5 + 0.62 * v, 0.62 * d);
}
float ezFbm2(vec3 p) { return (ezNoise(p) + 0.5 * ezNoise(p * 2.03 + vec3(17.1, 9.2, 13.7))) / 1.5; }
float ezFbm(vec3 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 4; i++) { s += a * ezNoise(p); p = p * 2.03 + vec3(17.1, 9.2, 13.7); a *= 0.5; }
  return s / 0.9375;
}
vec3 ezVoronoi(vec3 x) {                       // F1, F2, cell id
  vec3 i = floor(x), f = fract(x);
  float d1 = 8.0, d2 = 8.0, id = 0.0;
  for (int a = -1; a <= 1; a++) for (int b = -1; b <= 1; b++) for (int c = -1; c <= 1; c++) {
    vec3 g = vec3(float(a), float(b), float(c));
    vec3 o = ezHash3(i + g);
    vec3 r = g + o - f;
    float d = dot(r, r);
    if (d < d1) { d2 = d1; d1 = d; id = o.x + o.y * 0.37; } else if (d < d2) { d2 = d; }
  }
  return vec3(sqrt(d1), sqrt(d2), fract(id * 7.13));
}

// ---- glaze micro-relief: the gradient of the height field in object space (cm per cm), evaluated once per pixel.
// Orange peel on a lattice turned off the pot's axes, long slump waves, throwing rings whose pitch and depth wander,
// crackle grooves and pinholes. 'lost' is the slope a pixel is too large to show: it goes to roughness instead.
const mat3 EZ_R1 = mat3(0.36, 0.48, -0.80, -0.80, 0.60, 0.00, 0.48, 0.64, 0.60);
vec3 ezMicro(vec3 p, float fw, out float crack, out float cell, out float pit, out float lost) {
  vec3 pa = EZ_R1 * p, pb = (EZ_R1 * pa).zxy;
  float fa = 1.0 - smoothstep(0.022, 0.055, fw), fb = 1.0 - smoothstep(0.07, 0.18, fw);
  vec4 nw = ezNoiseD(pb * 0.55 + 3.0);
  vec4 na = vec4(0.0), nb = vec4(0.0);     // each octave only ever counts times uPeel and its fade: not asked once it has faded out
  if (uPeel != 0.0 && fa > 0.0) na = ezNoiseD(pa * 10.5 + 2.0 * nw.x);
  if (uPeel != 0.0 && fb > 0.0) nb = ezNoiseD(pb * 3.1 + 5.0);
  ezMotA = nw.x; ezMotB = mix(0.5, nb.x, fb * step(1e-4, abs(uPeel)));
  vec3 g = uPeel * (0.0075 * 10.5 * fa * (na.yzw * EZ_R1) + 0.017 * 3.1 * fb * ((nb.zwy * EZ_R1) * EZ_R1)) + uWave * 0.09 * 0.55 * ((nw.zwy * EZ_R1) * EZ_R1);
  lost = uPeel * (0.0075 * 10.5 * (1.0 - fa) + 0.017 * 3.1 * (1.0 - fb));
  // throwing rings: one spiral left by the fingers, stronger inside where no rib smoothed it; straps and lids have none
  float rr = max(dot(p.xz, p.xz), 0.04);
  float ph = 6.2831853 * p.y / 0.32 + atan(p.z, p.x) + 1.7 * sin(0.83 * p.y + uSeed) + 0.9 * sin(2.31 * p.y + 1.7 * uSeed);
  float amp = uHand * (vSurf.w > 2.5 ? 0.007 : 0.002) * (0.55 + 0.45 * sin(1.37 * p.y + 2.3 * uSeed) + 0.3 * sin(0.41 * p.y + uSeed))
            * (1.0 - smoothstep(0.035, 0.09, fw)) * smoothstep(0.2, 1.0, sqrt(rr)) * step(-0.5, vEzUv.x);
  g += amp * cos(ph) * vec3(-p.z / rr, 6.2831853 / 0.32 + 1.7 * 0.83 * cos(0.83 * p.y + uSeed) + 0.9 * 2.31 * cos(2.31 * p.y + 1.7 * uSeed), p.x / rr);
  crack = 0.0; cell = 0.5; pit = 0.0;
  if (uCrackle > 0.001) {
    vec3 x = p / uCrackleSize + (nw.x - 0.5) * 0.5, i = floor(x), f = fract(x), r1 = vec3(0.0), r2 = vec3(0.0);
    float d1 = 8.0, d2 = 8.0, id = 0.0;
    for (int a = -1; a <= 1; a++) for (int b = -1; b <= 1; b++) for (int c = -1; c <= 1; c++) {
      vec3 gq = vec3(float(a), float(b), float(c)), o = ezHash3(i + gq), r = gq + o - f;
      float d = dot(r, r);
      if (d < d1) { d2 = d1; r2 = r1; d1 = d; r1 = r; id = o.x + o.y * 0.37; } else if (d < d2) { d2 = d; r2 = r; }
    }
    d1 = sqrt(d1); d2 = sqrt(d2);
    float w = max(0.012, fw * 1.3), t = clamp((d2 - d1) * uCrackleSize / w, 0.0, 1.0), k = uCrackle * min(1.0, 0.03 / w);
    crack = (1.0 - t * t * (3.0 - 2.0 * t)) * k;
    cell = mix(0.5, fract(id * 7.13), smoothstep(0.0, 0.2, uCrackle));   // the mosaic comes in with the crack network, not ahead of it
    g += 0.006 * k * 6.0 * t * (1.0 - t) / w * (r1 / max(d1, 1e-4) - r2 / max(d2, 1e-4));
  }
  if (uPinholes > 0.001) {
    vec3 q = p * 2.3, i = floor(q), o = ezHash3(i + 3.7), c = fract(q) - (0.2 + 0.6 * o);
    float d = length(c);
    float r0 = 0.06 + 0.08 * o.z, r = max(r0, 1.5 * fw * 2.3), t = clamp(d / r, 0.0, 1.0);   // never smaller than a pixel: a wider, shallower pit of the same volume
    float k = step(1.0 - uPinholes * 0.3, ezHash(i + 9.1)) * (r0 * r0) / (r * r);
    pit = k * (1.0 - t * t * (3.0 - 2.0 * t));
    g += 0.012 * k * 6.0 * t * (1.0 - t) / r * 2.3 * c / max(d, 1e-4);
  }
  return g;
}
// Bare clay: trimming rings under the foot, fine grog, a coarser grog octave and grains of kiln sand ('Foot grit').
// near: 1 beside the glaze edge and on the foot ring, where the sand of the kiln shelf sticks.
vec3 ezClayRelief(vec3 p, float under, float fw, float near, out float sand, out float turn) {
  float l = max(length(p.xz), 0.05), f = 1.0 - smoothstep(0.03, 0.09, fw);
  vec3 g = f * (under * 0.004 * 26.0 * cos(l * 26.0) * vec3(p.x, 0.0, p.z) / l + 0.004 * 24.0 * ezNoiseD(p * 24.0).yzw);
  // turning marks on the bare wall of the foot ring: fine level lines that wander a little around the pot
  turn = uFootTurn * (1.0 - under) * f * cos(p.y * 41.0 + 0.6 * sin(atan(p.z, p.x + 1e-5) * 3.0 + uSeed) + 4.0 * ezNoise(vec3(p.y * 3.0, uSeed, 1.0)));
  g.y += 0.0045 * 41.0 * turn;
  g += uGrit * 0.04 * 5.3 * ezNoiseD(p * 5.3 + 7.0).yzw * (1.0 - smoothstep(0.1, 0.3, fw));
  vec3 q = p * 14.0, o = ezHash3(floor(q) + 5.1), c = fract(q) - (0.3 + 0.4 * o);
  float d = length(c), r = 0.16 + 0.14 * o.x, t = clamp(d / r, 0.0, 1.0);
  float k = uGrit * step(0.93 - 0.25 * near, o.z) * (0.4 + 0.6 * near) * (1.0 - smoothstep(0.015, 0.045, fw));
  sand = k * (1.0 - t * t * (3.0 - 2.0 * t));
  g -= 0.012 * k * 6.0 * t * (1.0 - t) / r * 14.0 * c / max(d, 1e-4);   // a grain stands proud
  return g;
}

// ---- film optics: air / cover film / Maxwell-Garnett metal-glass composite / glaze
vec2 ezCmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
vec2 ezCdiv(vec2 a, vec2 b) { return vec2(a.x * b.x + a.y * b.y, a.y * b.x - a.x * b.y) / max(dot(b, b), 1e-12); }
vec2 ezCsqrt(vec2 z) {       // principal root; the small component comes from 2ab = Im z, never from |z| - |Re z| (float32 cancellation)
  float a = sqrt(0.5 * (length(z) + abs(z.x)));
  float b = a > 0.0 ? 0.5 * abs(z.y) / a : 0.0;
  float s = z.y < 0.0 ? -1.0 : 1.0;
  return z.x >= 0.0 ? vec2(a, s * b) : vec2(b, s * a);
}
float ezSinc(float x) { return abs(x) < 1e-3 ? 1.0 : sin(x) / x; }
vec2 ezRfl(vec2 a, vec2 b) { return ezCdiv(a - b, a + b); }
float ezStack(vec2 n0, vec2 n1, vec2 n2, vec2 n3, vec2 p1, vec2 p2, float coh) {   // coh: see stackR
  vec2 r01 = ezRfl(n0, n1), r12 = ezRfl(n1, n2), r23 = ezRfl(n2, n3);
  vec2 x = ezCmul(r23, p2);
  vec2 r13 = ezCdiv(r12 + x, vec2(1.0, 0.0) + ezCmul(r12, x));
  x = ezCmul(r13, p1);
  vec2 r = ezCdiv(r01 + x, vec2(1.0, 0.0) + ezCmul(r01, x));
  float a = dot(r01, r01), b = min(dot(r13, r13), 1.0);
  float inc = (a + b - 2.0 * a * b) / max(1.0 - a * b, 1e-6);  // phase average of the Airy sum
  return mix(inc, dot(r, r), coh);
}
void ezLustreEval(float cosT, vec3 fill, float dC, float dM, out vec3 R, out vec3 T) {
  float s2 = 1.0 - cosT * cosT;
  R = vec3(0.0); T = vec3(0.0);
  for (int i = 0; i < EZ_MAX; i++) {
    if (i >= uSpecN) break;
    vec4 K = uEzK[i];
    vec2 em = vec2(K.x, 0.0);
    vec2 beta = fill.x * uEzAB[i].xy + fill.y * uEzAB[i].zw + fill.z * uEzCc[i];
    vec2 e2 = ezCmul(em, ezCdiv(vec2(1.0 + 2.0 * beta.x, 2.0 * beta.y), vec2(1.0 - beta.x, -beta.y)));
    vec2 e1 = vec2(K.y, 0.0);
    vec2 q1 = vec2(sqrt(max(e1.x - s2, 1e-6)), 0.0);
    vec2 q2 = ezCsqrt(vec2(e2.x - s2, e2.y));
    vec2 q3 = vec2(sqrt(max(em.x - s2, 1e-6)), 0.0);
    float a1 = K.z * dC * q1.x;
    vec2 p1 = vec2(cos(a1), sin(a1));
    vec2 d2 = K.z * dM * q2;
    float att = exp(-min(d2.y, 60.0));
    float coh = ezSinc(a1 * uSpecBW / K.w);                    // box filter over this sample's share of the spectrum
    vec2 p2 = att * ezSinc(d2.x * uSpecBW / K.w) * vec2(cos(d2.x), sin(d2.x));
    float Rs = ezStack(vec2(cosT, 0.0), q1, q2, q3, p1, p2, coh);
    float Rp = ezStack(vec2(1.0 / cosT, 0.0), ezCdiv(e1, q1), ezCdiv(e2, q2), ezCdiv(em, q3), p1, p2, coh);
    float r = min(0.5 * (Rs + Rp), 1.0);
    R += uCMF[i] * r;
    T += uCMF[i] * ((1.0 - r) * att * att);
  }
  R = clamp(R, 0.0, 1.0); T = clamp(T, 0.0, 1.0);
}

// ---- second lustre: where the decorator painted a different paste
float ezDecoMask(float rel, vec3 p) {
  float s = 0.02 + 0.3 * uDecoSoft, m = 0.0;
  if (uDeco == 1) {
    if (abs(rel - 0.34) < s + 0.05) rel += 0.05 * (ezNoise(p * 9.0) - 0.5) + 0.03 * (ezNoise(p * 31.0) - 0.5);   // a brushed edge, not a contour line
    m = smoothstep(0.34 - s, 0.34 + s, rel);
  } else if (uDeco == 2) {
    m = 1.0 - smoothstep(0.22 - s * 0.5, 0.22 + s * 0.5, abs(fract(vEzUv.y * uDecoRows) - 0.5));
  } else if (uDeco == 3) {
    vec2 g = vec2(vEzUv.x * uDecoCount, vEzUv.y * uDecoRows);
    g.x += 0.5 * mod(floor(g.y), 2.0);
    vec2 c = vec2(fract(g.x) - 0.5, fract(g.y));
    float d = length(vec2(c.x * 2.0, 1.0 - c.y));
    m = max(1.0 - smoothstep(0.07, 0.07 + s * 0.5, abs(d - 0.86)), 1.0 - smoothstep(0.2, 0.2 + s * 0.5, length(vec2(c.x * 2.0, (0.42 - c.y) * 1.3))));
  } else if (uDeco == 4) {
    float n = abs(ezFbm(p * 0.02 * uDecoCount + ezFbm(p * 0.05 * uDecoCount + 9.0) * 1.5 + uSeed) - 0.5) * 2.0;
    m = 1.0 - smoothstep(0.03, 0.05 + s * 0.6, n);
  } else if (uDeco == 5) {
    float cx = vEzUv.x * uDecoCount, x = fract(cx) - 0.5, dir = mod(floor(cx), 2.0) < 0.5 ? 1.0 : -1.0;
    float ph = vEzUv.y * uDecoRows * 3.14159265;
    m = 1.0 - smoothstep(0.045, 0.045 + s * 0.4, abs(x - dir * 0.28 * sin(ph)));
    m = max(m, 0.8 * (1.0 - smoothstep(0.02, 0.02 + s * 0.4, abs(x + dir * 0.14 * sin(ph * 2.0 + 1.0)))));
  }
  return m;
}
`;

const GLSL_FRAG_SURFACE = /* glsl */`
// ================= eozin: surface fields =================
vec3 ezP = vObjPos;
vec3 ezDx = dFdx(ezP), ezDy = dFdy(ezP);
float ezFw = max(length(ezDx), length(ezDy)) * uSrK;   // a still gathered at a reduced drawn scale resolves the output pixel, not the drawn one
float ezCav = vSurf.x, ezRel = vSurf.y, ezReg = vSurf.w;
float ezHN = clamp(ezP.y / uHeight, 0.0, 1.0);
float ezInner = smoothstep(2.4, 2.9, ezReg);
float ezUnder = 1.0 - smoothstep(0.1, 0.6, ezReg);
float ezOuter = smoothstep(0.4, 0.9, ezReg) * (1.0 - smoothstep(1.1, 1.6, ezReg));

// glaze line: where the pot was held while dipping
// The two noises move the line by less than 0.125 cm (|ezNoise - 0.5| < 0.94): farther from it the smoothstep is
// saturated and they are not asked. This and the guards below skip only what is multiplied by zero or cannot count.
float ezGlaze = step(0.0, vSurf.z);

// The paste lies thinner on a ridge and gathers in a hollow, and the clear cover film with it (uLustrePool).

// The mirror lobe of the glaze, traced against the piece itself. Where the ray meets wall, lid or handle, the room's

  // dimmed by the profile's occlusion as it is without tracing; where it is, a miss sees the room unshaded

    fs = swap(fs, '#include <lights_fragment_maps>', '#include <lights_fragment_maps>\n#if defined( USE_ENVMAP ) && defined( RE_IndirectSpecular )\nif (ezScat > 0.001) ezRad2 = getIBLRadiance( geometryViewDir, geometryNormal, uScatRough );\n' + GLSL_FRAG_SELF + '#endif');

    fs = swap(fs, '#include <aomap_fragment>', `{
  float ezAO = mix(1.0, clamp(vAO * (1.0 - 0.45 * max(vSurf.x, 0.0)), 0.0, 1.0), uAO);

function updateLabel() {
  const o = state.optics;

  for (let l = 400; l <= 700; l += 5) lams.push(l);
  const curves = SERIES.map((s) => lams.map((l) => lustreAt(l, Math.cos(s.deg * Math.PI / 180), o).R));
  let peak = 0;
  curves[0].forEach((v, i) => { if (v > curves[0][peak]) peak = i; });

  const vol = (v) => num(v * 100, v > 0 && v < 0.0295 ? 1 : 0);

  FINE_BASIS.lam.forEach((l, i) => { const w = FINE_BASIS.w[i]; through += (0.2126 * w[0] + 0.7152 * w[1] + 0.0722 * w[2]) * lustreAt(l, 1, o, FINE_BASIS.bw).T; });

    [say('film.cover'), `${num(o.dCover, 0)} nm · n ${num(o.nCover, 2)}`],
